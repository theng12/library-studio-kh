[package]
name = "library-studio-kh"
version = "0.7.30"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
# Only the opt-in verification build hashes its own executable for the startup marker.
sha2 = { version = "0.10", optional = true }
tauri = { version = "2", features = ["tray-icon"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# Opt-in verification binary only. The shipped release never enables it, and an
# ordinary build fails closed on --webview-check instead of running it.
webview-check = ["dep:sha2"]

[[bin]]
name = "library-studio-kh"
path = "src/main.rs"
test = true
